<p>Für den Inhalt der Kiste gilt:</p>
<p>$$x + \frac{p}{2} = \sqrt{\left(\frac{p}{2}\right)^2 - q} \quad \lor \quad x + \frac{p}{2} = -\sqrt{\left(\frac{p}{2}\right)^2 - q}$$</p>
